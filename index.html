<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="utf-8">
    <title>WebAR Experience</title>

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#090d16">

    <!-- Open Graph / WhatsApp / Telegram / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gitmax76.github.io/AR-Test/">
    <meta property="og:title" content="WebAR Experience | Scan &amp; Play">
    <meta property="og:description" content="Inquadra la carta con la fotocamera per dare vita al video in Realtà Aumentata. Nessuna app da installare.">
    <meta property="og:image" content="https://gitmax76.github.io/AR-Test/og-image.jpg">
    <meta property="og:image:secure_url" content="https://gitmax76.github.io/AR-Test/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="WebAR Experience">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://gitmax76.github.io/AR-Test/">
    <meta name="twitter:title" content="WebAR Experience | Scan &amp; Play">
    <meta name="twitter:description" content="Inquadra la carta con la fotocamera per dare vita al video in Realtà Aumentata.">
    <meta name="twitter:image" content="https://gitmax76.github.io/AR-Test/og-image.jpg">

    <!-- Core A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      :root {
        --primary: #3b82f6;
        --accent: #60a5fa;
        --neon-glow: rgba(59, 130, 246, 0.5);
        --bg-overlay: radial-gradient(circle at 50% 40%, #172554 0%, #090d16 85%);
        --glass-bg: rgba(15, 23, 42, 0.65);
        --glass-border: rgba(255, 255, 255, 0.15);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        overflow: hidden;
        background-color: #050811;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        width: 100vw;
        height: 100vh;
      }

      /* ===================================================
         SCHERMATA INIZIALE (VISUAL-FIRST, SENZA TESTI)
         =================================================== */
      #startOverlay {
        position: fixed;
        inset: 0;
        background: var(--bg-overlay);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 24px) + 20px) 24px calc(env(safe-area-inset-bottom, 24px) + 30px);
        z-index: 2000;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      }

      #startOverlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo / Indicatore AR in alto */
      .top-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 9999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .top-brand svg {
        width: 22px;
        height: 22px;
        fill: var(--accent);
      }

      .top-brand-dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
      }

      /* Animazione Centrale: Carta / Foto che viene scansionata e attiva il video */
      .hero-animation {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-target-visual {
        width: 140px;
        height: 180px;
        border-radius: 16px;
        background: linear-gradient(145deg, #1e293b, #0f172a);
        border: 2px solid rgba(96, 165, 250, 0.4);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        transform: perspective(600px) rotateX(15deg);
        animation: cardFloat 3.5s ease-in-out infinite;
      }

      @keyframes cardFloat {
        0%, 100% { transform: perspective(600px) rotateX(15deg) translateY(0); }
        50% { transform: perspective(600px) rotateX(15deg) translateY(-8px); }
      }

      /* Pattern geometrico sulla carta che evoca un target da gioco */
      .card-inner-pattern {
        width: 90px;
        height: 120px;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .card-inner-pattern::after {
        content: '';
        position: absolute;
        width: 32px;
        height: 32px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        opacity: 0.7;
      }

      /* Raggio laser di scansione animato */
      .scan-beam {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #60a5fa, #38bdf8, transparent);
        box-shadow: 0 0 12px #38bdf8;
        animation: scanMove 2.2s ease-in-out infinite;
      }

      @keyframes scanMove {
        0% { top: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* Ologramma Video Pop-up sopra la carta */
      .hologram-icon {
        position: absolute;
        top: 15px;
        right: 25px;
        width: 44px;
        height: 44px;
        background: rgba(37, 99, 235, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
        backdrop-filter: blur(8px);
        animation: holoPulse 2s ease-in-out infinite;
      }

      @keyframes holoPulse {
        0%, 100% { transform: scale(1) translateY(0); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5); }
        50% { transform: scale(1.08) translateY(-4px); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.8); }
      }

      .hologram-icon svg {
        width: 22px;
        height: 22px;
        fill: #fff;
        margin-left: 2px;
      }

      /* Pulsante Grande di Avvio Fotocamera (Universale) */
      .btn-launch {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        border: 2px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 8px rgba(59, 130, 246, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        animation: ringPulse 2.5s infinite;
      }

      @keyframes ringPulse {
        0% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 0 rgba(59, 130, 246, 0.3); }
        70% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 18px rgba(59, 130, 246, 0); }
        100% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 0 rgba(59, 130, 246, 0); }
      }

      .btn-launch:active {
        transform: scale(0.92);
      }

      .btn-launch svg {
        width: 34px;
        height: 34px;
        fill: #ffffff;
      }

      /* ===================================================
         INTERFACCIA IN-AR (DURANTE L'USO)
         =================================================== */
      
      /* Mirino Olografico di Scansione (Attivo durante la ricerca del target) */
      #scanReticle {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.35s ease;
      }

      #scanReticle.detected {
        opacity: 0;
      }

      .reticle-box {
        width: 220px;
        height: 280px;
        max-width: 65vw;
        max-height: 50vh;
        position: relative;
      }

      /* Angoli del mirino */
      .corner {
        position: absolute;
        width: 28px;
        height: 28px;
        border-color: #60a5fa;
        border-style: solid;
      }

      .top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
      .top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
      .bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
      .bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }

      .reticle-laser {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        box-shadow: 0 0 10px #38bdf8;
        animation: reticleScan 2s ease-in-out infinite;
      }

      @keyframes reticleScan {
        0% { top: 5%; opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { top: 95%; opacity: 0; }
      }

      /* Barra Superiore / Controlli Fluttuanti In-AR */
      .ar-hud-top {
        position: fixed;
        top: calc(env(safe-area-inset-top, 20px) + 12px);
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        pointer-events: none;
      }

      /* Pillola di stato target (Solo icona e feedback visivo) */
      .status-pill {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
        transition: background-color 0.25s, box-shadow 0.25s;
      }

      .status-pill.active .status-dot {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }

      .status-pill svg {
        width: 16px;
        height: 16px;
        fill: #cbd5e1;
      }

      /* Tasto Audio Universale (Solo Icona Mute / Unmute) */
      .btn-audio {
        pointer-events: auto;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s;
      }

      .btn-audio:active {
        transform: scale(0.92);
      }

      .btn-audio.unmuted {
        background: rgba(37, 99, 235, 0.75);
        border-color: rgba(96, 165, 250, 0.6);
      }

      .btn-audio svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }
    </style>
  </head>
  <body>

    <!-- ==============================================
         OVERLAY INIZIALE (VISIVO / LINGUA AGNOSTICO)
         ============================================== -->
    <div id="startOverlay">
      <!-- Indicatore AR in alto -->
      <div class="top-brand">
        <svg viewBox="0 0 24 24">
          <path d="M4 6V4h4V2H4a2 2 0 0 0-2 2v4h2V6zm14-4h-4v2h4v2h2V4a2 2 0 0 0-2-2zM2 18v-4H0v4a2 2 0 0 0 2 2h4v-2H2zm18 0h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </svg>
        <span class="top-brand-dot"></span>
      </div>

      <!-- Illustrazione / Animazione del concept: inquadra la carta per il video -->
      <div class="hero-animation">
        <div class="card-target-visual">
          <div class="card-inner-pattern"></div>
          <div class="scan-beam"></div>
        </div>
        <!-- Icona Play Olografica -->
        <div class="hologram-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

      <!-- Pulsante Rotondo Universale di Avvio -->
      <button class="btn-launch" id="startBtn" aria-label="Start AR">
        <svg viewBox="0 0 24 24">
          <path d="M9.5 6.5v11l9-5.5z"/>
        </svg>
      </button>
    </div>

    <!-- ==============================================
         HUD IN-AR (DURANTE LA FOTOCAMERA)
         ============================================== -->
    
    <!-- Barra Superiore Fluttuante -->
    <div class="ar-hud-top">
      <!-- Indicatore di stato rilevamento (Grigio = ricerca, Verde = agganciato) -->
      <div class="status-pill" id="statusPill">
        <span class="status-dot"></span>
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
      </div>

      <!-- Pulsante Audio Toggle Universale (Mute / Unmute con icone SVG) -->
      <button class="btn-audio" id="audioToggle" aria-label="Toggle Audio">
        <!-- Icona Audio Mute (Default) -->
        <svg id="iconMuted" viewBox="0 0 24 24">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <!-- Icona Audio On (Nascosta inizialmente) -->
        <svg id="iconUnmuted" viewBox="0 0 24 24" style="display:none;">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
    </div>

    <!-- Mirino Grafico Scanner (Mostrato finché l'utente non inquadra il target) -->
    <div id="scanReticle">
      <div class="reticle-box">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="reticle-laser"></div>
      </div>
    </div>

    <!-- ==============================================
         SCENA A-FRAME & MINDAR
         ============================================== -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Contenitore video dinamico -->
      <a-assets id="arAssets">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target aggiunti a runtime tramite targets.json -->

    </a-scene>

    <script>
      // Riferimenti DOM
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const audioToggle = document.getElementById('audioToggle');
      const iconMuted = document.getElementById('iconMuted');
      const iconUnmuted = document.getElementById('iconUnmuted');
      const scanReticle = document.getElementById('scanReticle');
      const statusPill = document.getElementById('statusPill');

      const sceneEl = document.querySelector('a-scene');
      const assetsEl = document.getElementById('arAssets');

      // Stato Applicazione
      let isAudioMuted = true;
      let targetsData = [];
      let activeTargetItem = null;
      const videoElements = [];

      // Gestione Grafica Audio Toggle
      function updateAudioUI() {
        if (isAudioMuted) {
          iconMuted.style.display = 'block';
          iconUnmuted.style.display = 'none';
          audioToggle.classList.remove('unmuted');
        } else {
          iconMuted.style.display = 'none';
          iconUnmuted.style.display = 'block';
          audioToggle.classList.add('unmuted');
        }
      }

      // 1. Carica la configurazione dinamica dei target
      async function loadDynamicConfig() {
        try {
          const res = await fetch('./targets.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('Failed to load targets.json');
          targetsData = await res.json();

          targetsData.forEach((targetItem) => {
            const index = targetItem.index;
            const videoId = `arVideo-${index}`;

            // Creazione programmatic <video> dentro <a-assets>
            const videoEl = document.createElement('video');
            videoEl.id = videoId;
            videoEl.src = targetItem.videoUrl;
            videoEl.setAttribute('preload', 'none');
            videoEl.setAttribute('crossorigin', 'anonymous');
            videoEl.setAttribute('playsinline', '');
            videoEl.setAttribute('webkit-playsinline', '');
            videoEl.muted = isAudioMuted;
            videoEl.loop = true;
            assetsEl.appendChild(videoEl);
            videoElements.push(videoEl);

            // Creazione programmatic <a-entity mindar-image-target>
            const targetEntity = document.createElement('a-entity');
            targetEntity.setAttribute('mindar-image-target', `targetIndex: ${index}`);
            targetEntity.id = `targetEntity-${index}`;

            // Creazione programmatic <a-video>
            const videoPlane = document.createElement('a-video');
            videoPlane.id = `videoPlane-${index}`;
            videoPlane.setAttribute('src', `#${videoId}`);
            videoPlane.setAttribute('width', '1');
            videoPlane.setAttribute('height', '1');
            videoPlane.setAttribute('position', '0 0 0');
            videoPlane.setAttribute('rotation', '0 0 0');
            targetEntity.appendChild(videoPlane);

            sceneEl.appendChild(targetEntity);

            // Adattamento proporzioni dinamico quando il video è pronto
            const updateAspect = () => {
              if (videoEl.videoWidth && videoEl.videoHeight) {
                const ratio = videoEl.videoHeight / videoEl.videoWidth;
                videoPlane.setAttribute('width', '1');
                videoPlane.setAttribute('height', ratio.toString());
              }
            };
            videoEl.addEventListener('loadedmetadata', updateAspect);

            // Gestione eventi: Target Riconosciuto
            targetEntity.addEventListener('targetFound', () => {
              // Ferma eventuale video precedente (anti-sovrapposizione)
              if (activeTargetItem && activeTargetItem.videoEl !== videoEl) {
                activeTargetItem.videoEl.pause();
              }

              activeTargetItem = { index, videoEl };
              videoEl.muted = isAudioMuted;
              videoEl.play().catch(e => console.warn('Play prevented:', e));

              // Feedback visivo immediato (iconico)
              scanReticle.classList.add('detected');
              statusPill.classList.add('active');
            });

            // Gestione eventi: Target Perso
            targetEntity.addEventListener('targetLost', () => {
              if (activeTargetItem && activeTargetItem.videoEl === videoEl) {
                videoEl.pause();
                activeTargetItem = null;

                // Riattiva mirino per guidare l'utente
                scanReticle.classList.remove('detected');
                statusPill.classList.remove('active');
              }
            });
          });
        } catch (err) {
          console.error('[WebAR Setup Error]', err);
        }
      }

      // Avvio fotocamera e sblocco policy al tap sul pulsante centrale
      startBtn.addEventListener('click', () => {
        startOverlay.classList.add('hidden');

        try {
          const mindarSystem = sceneEl.systems['mindar-image-system'];
          if (mindarSystem) {
            mindarSystem.start();
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.systems['mindar-image-system'].start();
            });
          }
        } catch (err) {
          console.error('MindAR error:', err);
        }

        // Sblocco audio per tutti i video
        videoElements.forEach(v => {
          v.muted = isAudioMuted;
        });
      });

      // Toggle Audio (Mute / Unmute)
      audioToggle.addEventListener('click', () => {
        isAudioMuted = !isAudioMuted;
        videoElements.forEach(video => {
          video.muted = isAudioMuted;
        });
        updateAudioUI();
      });

      // Inizializza
      loadDynamicConfig();
    </script>
  </body>
</html>
