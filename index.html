<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <title>AR Experience</title>

    <!-- Core A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Controlli a schermo */
      .ui-container {
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        z-index: 1000;
        pointer-events: none;
      }

      .btn-ar {
        pointer-events: auto;
        padding: 12px 24px;
        background: rgba(20, 20, 20, 0.85);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        transition: transform 0.1s ease, background 0.2s ease;
      }

      .btn-ar:active {
        transform: scale(0.95);
      }

      /* Schermata iniziale per sblocco permessi e autoplay */
      #startOverlay {
        position: fixed;
        inset: 0;
        background: #11141a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 24px;
        text-align: center;
      }

      #startOverlay h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
      }

      #startOverlay p {
        font-size: 0.95rem;
        color: #94a3b8;
        max-width: 320px;
        line-height: 1.4;
        margin-bottom: 24px;
      }

      .btn-start {
        padding: 14px 32px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9999px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>
  <body>

    <!-- Overlay iniziale -->
    <div id="startOverlay">
      <h1>Inizia Esperienza AR</h1>
      <p>Consenti l'accesso alla fotocamera e inquadra l'immagine per riprodurre il video.</p>
      <button class="btn-start" id="startBtn">Avvia Fotocamera</button>
    </div>

    <!-- UI Overlay per l'audio -->
    <div class="ui-container">
      <button id="muteButton" class="btn-ar">Attiva Audio</button>
    </div>

    <!-- Scena MindAR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Video hostato su Cloudinary con crossorigin attivo -->
        <video 
          id="arVideo" 
          src="https://res.cloudinary.com/h0ch4sxd/video/upload/v1788443837/v24044gl0000d7vo42fog65gfgphs5mg.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline 
          muted>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 collegato al marker compilato -->
      <a-entity id="targetMarker" mindar-image-target="targetIndex: 0">
        <a-video 
          id="videoPlane"
          src="#arVideo" 
          width="1" 
          height="1" 
          position="0 0 0" 
          rotation="0 0 0">
        </a-video>
      </a-entity>

    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const targetMarker = document.querySelector('#targetMarker');
      const video = document.querySelector('#arVideo');
      const videoPlane = document.querySelector('#videoPlane');
      const muteButton = document.getElementById('muteButton');
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');

      // Calcola e adatta le proporzioni (width/height) appena i metadata del video sono pronti
      video.addEventListener('loadedmetadata', () => {
        if (video.videoWidth && video.videoHeight) {
          const ratio = video.videoHeight / video.videoWidth;
          videoPlane.setAttribute('width', 1);
          videoPlane.setAttribute('height', ratio);
        }
      });

      // Click sul pulsante iniziale: avvia AR e sblocca l'autoplay del video
      startBtn.addEventListener('click', () => {
        startOverlay.style.display = 'none';

        // Avvio del sistema MindAR
        sceneEl.systems["mindar-image-system"].start();

        // Warm-up del flusso video per policy iOS/Android
        video.play().then(() => {
          video.pause();
        }).catch(err => {
          console.warn("Autoplay policy check:", err);
        });
      });

      // Eventi di tracking del marker
      targetMarker.addEventListener("targetFound", () => {
        video.play();
      });

      targetMarker.addEventListener("targetLost", () => {
        video.pause();
      });

      // Gestione Mute / Unmute
      muteButton.addEventListener('click', () => {
        video.muted = !video.muted;
        muteButton.innerText = video.muted ? "Attiva Audio" : "Disattiva Audio";
      });
    </script>
  </body>
</html>
