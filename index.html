<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="utf-8">
    <title>WebAR Experience</title>

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#090d16">

    <!-- Open Graph / WhatsApp / Telegram / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gitmax76.github.io/AR-Test/">
    <meta property="og:title" content="WebAR Experience | Scan &amp; Play">
    <meta property="og:description" content="Inquadra la carta con la fotocamera per dare vita al video in Realtà Aumentata. Nessuna app da installare.">
    <meta property="og:image" content="https://gitmax76.github.io/AR-Test/og-image.jpg">
    <meta property="og:image:secure_url" content="https://gitmax76.github.io/AR-Test/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="WebAR Experience">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://gitmax76.github.io/AR-Test/">
    <meta name="twitter:title" content="WebAR Experience | Scan &amp; Play">
    <meta name="twitter:description" content="Inquadra la carta con la fotocamera per dare vita al video in Realtà Aumentata.">
    <meta name="twitter:image" content="https://gitmax76.github.io/AR-Test/og-image.jpg">

    <!-- Core A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      :root {
        --primary: #3b82f6;
        --accent: #60a5fa;
        --neon-glow: rgba(59, 130, 246, 0.5);
        --bg-overlay: radial-gradient(circle at 50% 40%, #172554 0%, #090d16 85%);
        --glass-bg: rgba(15, 23, 42, 0.65);
        --glass-border: rgba(255, 255, 255, 0.15);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        overflow: hidden;
        background-color: #050811;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        width: 100vw;
        height: 100vh;
      }

      /* ===================================================
         SCHERMATA INIZIALE (VISUAL-FIRST, SENZA TESTI)
         =================================================== */
      #startOverlay {
        position: fixed;
        inset: 0;
        background: var(--bg-overlay);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 24px) + 20px) 24px calc(env(safe-area-inset-bottom, 24px) + 30px);
        z-index: 2000;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
      }

      #startOverlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo / Indicatore AR in alto */
      .top-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 18px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 9999px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .top-brand svg {
        width: 22px;
        height: 22px;
        fill: var(--accent);
      }

      .top-brand-dot {
        width: 6px;
        height: 6px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 8px #22c55e;
      }

      /* Animazione Centrale: Carta / Foto che viene scansionata e attiva il video */
      .hero-animation {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-target-visual {
        width: 140px;
        height: 180px;
        border-radius: 16px;
        background: linear-gradient(145deg, #1e293b, #0f172a);
        border: 2px solid rgba(96, 165, 250, 0.4);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        transform: perspective(600px) rotateX(15deg);
        animation: cardFloat 3.5s ease-in-out infinite;
      }

      @keyframes cardFloat {
        0%, 100% { transform: perspective(600px) rotateX(15deg) translateY(0); }
        50% { transform: perspective(600px) rotateX(15deg) translateY(-8px); }
      }

      /* Pattern geometrico sulla carta che evoca un target da gioco */
      .card-inner-pattern {
        width: 90px;
        height: 120px;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .card-inner-pattern::after {
        content: '';
        position: absolute;
        width: 32px;
        height: 32px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        opacity: 0.7;
      }

      /* Raggio laser di scansione animato */
      .scan-beam {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #60a5fa, #38bdf8, transparent);
        box-shadow: 0 0 12px #38bdf8;
        animation: scanMove 2.2s ease-in-out infinite;
      }

      @keyframes scanMove {
        0% { top: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* Ologramma Video Pop-up sopra la carta */
      .hologram-icon {
        position: absolute;
        top: 15px;
        right: 25px;
        width: 44px;
        height: 44px;
        background: rgba(37, 99, 235, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
        backdrop-filter: blur(8px);
        animation: holoPulse 2s ease-in-out infinite;
      }

      @keyframes holoPulse {
        0%, 100% { transform: scale(1) translateY(0); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5); }
        50% { transform: scale(1.08) translateY(-4px); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.8); }
      }

      .hologram-icon svg {
        width: 22px;
        height: 22px;
        fill: #fff;
        margin-left: 2px;
      }

      /* Pulsante Grande di Avvio Fotocamera (Universale) */
      .btn-launch {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        border: 2px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 8px rgba(59, 130, 246, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        animation: ringPulse 2.5s infinite;
      }

      @keyframes ringPulse {
        0% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 0 rgba(59, 130, 246, 0.3); }
        70% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 18px rgba(59, 130, 246, 0); }
        100% { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.6), 0 0 0 0 rgba(59, 130, 246, 0); }
      }

      .btn-launch:active {
        transform: scale(0.92);
      }

      .btn-launch svg {
        width: 34px;
        height: 34px;
        fill: #ffffff;
      }

      /* ===================================================
         INTERFACCIA IN-AR (DURANTE L'USO)
         =================================================== */
      
      /* Mirino Olografico di Scansione (Attivo durante la ricerca del target) */
      #scanReticle {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.35s ease;
      }

      #scanReticle.detected {
        opacity: 0;
      }

      .reticle-box {
        width: 220px;
        height: 280px;
        max-width: 65vw;
        max-height: 50vh;
        position: relative;
      }

      /* Angoli del mirino */
      .corner {
        position: absolute;
        width: 28px;
        height: 28px;
        border-color: #60a5fa;
        border-style: solid;
      }

      .top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
      .top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
      .bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
      .bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }

      .reticle-laser {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        box-shadow: 0 0 10px #38bdf8;
        animation: reticleScan 2s ease-in-out infinite;
      }

      @keyframes reticleScan {
        0% { top: 5%; opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.9; }
        100% { top: 95%; opacity: 0; }
      }

      /* Barra Superiore / Controlli Fluttuanti In-AR */
      .ar-hud-top {
        position: fixed;
        top: calc(env(safe-area-inset-top, 20px) + 12px);
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        z-index: 1000;
        pointer-events: none;
      }

      .ar-hud-top-left {
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      .ar-hud-top-right {
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: auto;
      }

      /* Pillola di stato target (Solo icona e feedback visivo) */
      .status-pill {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
        transition: background-color 0.25s, box-shadow 0.25s;
      }

      .status-pill.active .status-dot {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }

      .status-pill svg {
        width: 16px;
        height: 16px;
        fill: #cbd5e1;
      }

      /* Pulsanti HUD Generici */
      .btn-hud {
        pointer-events: auto;
        padding: 8px 14px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        color: #fff;
        font-size: 0.8rem;
        font-weight: 600;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        outline: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s;
      }

      .btn-hud:active {
        transform: scale(0.94);
      }

      .btn-hud-primary {
        background: rgba(37, 99, 235, 0.75);
        border-color: rgba(96, 165, 250, 0.6);
      }

      /* Toast informativo per suggerimenti AR */
      .ar-toast {
        position: fixed;
        top: calc(env(safe-area-inset-top, 20px) + 70px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.88);
        color: #60a5fa;
        border: 1px solid rgba(96, 165, 250, 0.4);
        padding: 10px 18px;
        border-radius: 20px;
        font-size: 0.82rem;
        font-weight: 600;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 1000;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
        text-align: center;
        white-space: nowrap;
        max-width: 90vw;
      }

      .ar-toast.hidden {
        opacity: 0;
        transform: translate(-50%, -10px);
      }

      /* Tasto Audio Universale (Solo Icona Mute / Unmute) */
      .btn-audio {
        pointer-events: auto;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: transform 0.15s ease, background-color 0.2s, border-color 0.2s;
      }

      .btn-audio:active {
        transform: scale(0.92);
      }

      .btn-audio.unmuted {
        background: rgba(37, 99, 235, 0.75);
        border-color: rgba(96, 165, 250, 0.6);
      }

      .btn-audio svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }

      /* Slider Opacità 3D / 360 ("Ieri vs Oggi") */
      .ar-hud-bottom {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
        left: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 1000;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .ar-hud-bottom.hidden {
        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
      }

      .slider-container {
        pointer-events: auto;
        width: 100%;
        max-width: 340px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 10px 18px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }

      .slider-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        font-weight: 600;
        color: #cbd5e1;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .slider-input {
        width: 100%;
        accent-color: var(--primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- ==============================================
         OVERLAY INIZIALE (VISIVO / LINGUA AGNOSTICO)
         ============================================== -->
    <div id="startOverlay">
      <!-- Indicatore AR in alto -->
      <div class="top-brand">
        <svg viewBox="0 0 24 24">
          <path d="M4 6V4h4V2H4a2 2 0 0 0-2 2v4h2V6zm14-4h-4v2h4v2h2V4a2 2 0 0 0-2-2zM2 18v-4H0v4a2 2 0 0 0 2 2h4v-2H2zm18 0h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </svg>
        <span class="top-brand-dot"></span>
      </div>

      <!-- Illustrazione / Animazione del concept: inquadra la carta per il video -->
      <div class="hero-animation">
        <div class="card-target-visual">
          <div class="card-inner-pattern"></div>
          <div class="scan-beam"></div>
        </div>
        <!-- Icona Play Olografica -->
        <div class="hologram-icon">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

      <!-- Pulsante Rotondo Universale di Avvio -->
      <button class="btn-launch" id="startBtn" aria-label="Start AR">
        <svg viewBox="0 0 24 24">
          <path d="M9.5 6.5v11l9-5.5z"/>
        </svg>
      </button>
    </div>

    <!-- ==============================================
         HUD IN-AR (DURANTE LA FOTOCAMERA)
         ============================================== -->
    
    <!-- Toast Informativo Floating -->
    <div id="arToast" class="ar-toast hidden"></div>

    <!-- Barra Superiore Fluttuante -->
    <div class="ar-hud-top">
      <div class="ar-hud-top-left">
        <!-- Indicatore di stato rilevamento -->
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z"/>
          </svg>
        </div>

        <!-- Pulsanti di controllo per il Modello 3D nello Spazio -->
        <button class="btn-hud btn-hud-primary" id="recenterBtn" style="display:none;">🎯 Ricentra 3D</button>
        <button class="btn-hud" id="reset3dBtn" style="display:none;">🔄 Reset</button>
      </div>

      <div class="ar-hud-top-right">
        <!-- Pulsante Audio Toggle Universale -->
        <button class="btn-audio" id="audioToggle" aria-label="Toggle Audio">
          <svg id="iconMuted" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
          <svg id="iconUnmuted" viewBox="0 0 24 24" style="display:none;">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Slider Fluttuante "Ieri vs Oggi" per Modelli 3D e 360 -->
    <div class="ar-hud-bottom hidden" id="arHudBottom">
      <div class="slider-container">
        <div class="slider-labels">
          <span>🏛️ Passato (3D)</span>
          <span>👁️ Presente (Real)</span>
        </div>
        <input type="range" id="opacitySlider" class="slider-input" min="0.05" max="1" step="0.05" value="0.9">
        <div id="gestureHint" style="font-size:0.72rem; color:#94a3b8; margin-top:4px; display:none;">
          👆 Trascina 1 dito per ruotare • 🤏 Pizzica 2 dita per scalare
        </div>
      </div>
    </div>

    <!-- Mirino Grafico Scanner (Mostrato finché l'utente non inquadra il target) -->
    <div id="scanReticle">
      <div class="reticle-box">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="reticle-laser"></div>
      </div>
    </div>

    <!-- ==============================================
         SCENA A-FRAME & MINDAR
         ============================================== -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind?v=7; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Contenitore video e 3D dinamico -->
      <a-assets id="arAssets">
      </a-assets>

      <!-- Fotocamera con Giroscopio / DeviceOrientation attivo per esplorare l'ambiente 3D -->
      <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: true; touchEnabled: false; magicWindowControlsEnabled: true"></a-camera>

      <!-- Contenitore Mondo 3D Persistente per Oggetti Singoli -->
      <a-entity id="world3DContainer" visible="false"></a-entity>

      <!-- Contenitore 3D per Ricostruzione Immersiva dell'Ambiente / Stanza 1:1 -->
      <a-entity id="env3DContainer" visible="false">
        <a-entity id="proceduralBath">
          <!-- Pavimento a Mosaico Marmo Bianco/Grigio (al livello piedi Y = -1.6) -->
          <a-plane position="0 -1.6 0" rotation="-90 0 0" width="16" height="16" color="#f1f5f9" material="roughness: 0.2; side: double; transparent: true; opacity: 0.85"></a-plane>

          <!-- Vasca Termale Centrale con Acqua Turchese Brillante e Bordo in Marmo -->
          <a-box position="0 -1.65 0" width="7.6" height="0.2" depth="7.6" color="#fbbf24" material="side: double; roughness: 0.3"></a-box>
          <a-plane position="0 -1.55 0" rotation="-90 0 0" width="7" height="7" color="#38bdf8" material="transparent: true; opacity: 0.8; roughness: 0.1; side: double; metalness: 0.2"></a-plane>

          <!-- Colonnato Peristilio Romano (8 Colonne d'Oro e Marmo con Capitelli) -->
          <a-cylinder position="-4 0 -4" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="-4 1.6 -4" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="4 0 -4" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="4 1.6 -4" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="-4 0 4" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="-4 1.6 4" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="4 0 4" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="4 1.6 4" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>

          <a-cylinder position="0 0 -5.5" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="0 1.6 -5.5" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="0 0 5.5" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="0 1.6 5.5" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="-5.5 0 0" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="-5.5 1.6 0" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>
          <a-cylinder position="5.5 0 0" radius="0.3" height="3.2" color="#ffffff" material="roughness: 0.2; side: double"></a-cylinder>
          <a-box position="5.5 1.6 0" width="0.8" height="0.2" depth="0.8" color="#f59e0b" material="side: double"></a-box>

          <!-- Architrave Superiore / Fregio Romano Dorato -->
          <a-box position="0 1.75 -4" width="8.8" height="0.3" depth="0.6" color="#cbd5e1" material="side: double"></a-box>
          <a-box position="0 1.75 4" width="8.8" height="0.3" depth="0.6" color="#cbd5e1" material="side: double"></a-box>
          <a-box position="-4 1.75 0" width="0.6" height="0.3" depth="8.8" color="#cbd5e1" material="side: double"></a-box>
          <a-box position="4 1.75 0" width="0.6" height="0.3" depth="8.8" color="#cbd5e1" material="side: double"></a-box>

          <!-- Pareti Perimetrali a Loggiato Aperto (Marmo Chiaro) -->
          <a-box position="0 0.5 -7" width="15" height="4.2" depth="0.3" color="#f8fafc" material="side: double; transparent: true; opacity: 0.75"></a-box>
          <a-box position="0 0.5 7" width="15" height="4.2" depth="0.3" color="#f8fafc" material="side: double; transparent: true; opacity: 0.75"></a-box>
          <a-box position="-7 0.5 0" width="0.3" height="4.2" depth="15" color="#f8fafc" material="side: double; transparent: true; opacity: 0.75"></a-box>
          <a-box position="7 0.5 0" width="0.3" height="4.2" depth="15" color="#f8fafc" material="side: double; transparent: true; opacity: 0.75"></a-box>

          <!-- Cornice Perimetrale del Peristilio -->
          <a-torus position="0 2.2 0" rotation="90 0 0" radius="5.5" radius-tubular="0.2" color="#fbbf24" material="side: double"></a-torus>

          <!-- Torce Romane e Pedestali d'Angolo -->
          <a-cylinder position="-3.5 -1.0 -3.5" radius="0.25" height="1.2" color="#64748b"></a-cylinder>
          <a-sphere position="-3.5 -0.3 -3.5" radius="0.25" color="#f59e0b" material="emissive: #f59e0b; emissiveIntensity: 0.8"></a-sphere>

          <a-cylinder position="3.5 -1.0 -3.5" radius="0.25" height="1.2" color="#64748b"></a-cylinder>
          <a-sphere position="3.5 -0.3 -3.5" radius="0.25" color="#f59e0b" material="emissive: #f59e0b; emissiveIntensity: 0.8"></a-sphere>
        </a-entity>

        <!-- Illuminazione Ambientale Chiara e Calda -->
        <a-light type="ambient" intensity="1.2" color="#ffffff"></a-light>
        <a-light type="directional" position="0 5 2" intensity="1.0" color="#fef08a"></a-light>
      </a-entity>

      <!-- Target aggiunti a runtime tramite targets.json -->

    </a-scene>

    <script>
      // Riferimenti DOM
      const startOverlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const audioToggle = document.getElementById('audioToggle');
      const iconMuted = document.getElementById('iconMuted');
      const iconUnmuted = document.getElementById('iconUnmuted');
      const scanReticle = document.getElementById('scanReticle');
      const statusPill = document.getElementById('statusPill');
      const arHudBottom = document.getElementById('arHudBottom');
      const opacitySlider = document.getElementById('opacitySlider');
      const recenterBtn = document.getElementById('recenterBtn');
      const reset3dBtn = document.getElementById('reset3dBtn');
      const arToast = document.getElementById('arToast');
      const gestureHint = document.getElementById('gestureHint');

      const sceneEl = document.querySelector('a-scene');
      const assetsEl = document.getElementById('arAssets');
      const mainCamera = document.getElementById('mainCamera');
      const world3DContainer = document.getElementById('world3DContainer');
      const env3DContainer = document.getElementById('env3DContainer');

      // Stato Applicazione
      let isAudioMuted = true;
      let targetsData = [];
      let activeTargetItem = null;
      let is3DAnchored = false;
      let isTargetTracked = false;
      let isGyroActive = false;
      let trackingSyncFrame = null;
      const videoElements = [];

      // Controllo Giroscopio 360° per Esplorazione Ambiente Stanza
      window.addEventListener('deviceorientation', (e) => {
        if (!isGyroActive || !mainCamera || !mainCamera.object3D) return;
        
        const alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
        const beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
        const gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;

        // Orienta la fotocamera A-Frame a 360° secondo i movimenti dello smartphone
        const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
        mainCamera.object3D.quaternion.setFromEuler(euler);
      }, true);

      // Helper notifiche toast
      function showToast(msg, duration = 4500) {
        if (!arToast) return;
        arToast.textContent = msg;
        arToast.classList.remove('hidden');
        clearTimeout(arToast._timer);
        arToast._timer = setTimeout(() => {
          arToast.classList.add('hidden');
        }, duration);
      }

      // Gestione Grafica Audio Toggle
      function updateAudioUI() {
        if (isAudioMuted) {
          iconMuted.style.display = 'block';
          iconUnmuted.style.display = 'none';
          audioToggle.classList.remove('unmuted');
        } else {
          iconMuted.style.display = 'none';
          iconUnmuted.style.display = 'block';
          audioToggle.classList.add('unmuted');
        }
      }

      // Sincronizzazione continua per Oggetti 3D Singoli ancorati al target cartaceo
      function sync3DWorldAnchor() {
        if (isTargetTracked && activeTargetItem && activeTargetItem.targetType === 'model3d' && activeTargetItem.targetEntity) {
          const targetObj = activeTargetItem.targetEntity.object3D;
          if (targetObj && world3DContainer) {
            const worldPos = new THREE.Vector3();
            const worldQuat = new THREE.Quaternion();

            targetObj.getWorldPosition(worldPos);
            targetObj.getWorldQuaternion(worldQuat);

            world3DContainer.object3D.position.copy(worldPos);
            world3DContainer.object3D.quaternion.copy(worldQuat);
          }
        }
        trackingSyncFrame = requestAnimationFrame(sync3DWorldAnchor);
      }
      trackingSyncFrame = requestAnimationFrame(sync3DWorldAnchor);

      // 1. Carica la configurazione dinamica dei target (Video, Modelli 3D Oggetto, Ricostruzioni Ambiente 3D, Sky 360)
      async function loadDynamicConfig() {
        try {
          const res = await fetch('./targets.json?v=7', { cache: 'no-cache' });
          if (!res.ok) throw new Error('Failed to load targets.json');
          targetsData = await res.json();

          targetsData.forEach((targetItem) => {
            const index = targetItem.index;
            const targetType = targetItem.type || (targetItem.modelUrl ? 'model3d' : targetItem.skyUrl ? 'sky360' : 'video');

            // Creazione programmatic <a-entity mindar-image-target>
            const targetEntity = document.createElement('a-entity');
            targetEntity.setAttribute('mindar-image-target', `targetIndex: ${index}`);
            targetEntity.id = `targetEntity-${index}`;

            let videoEl = null;
            let modelEl = null;
            let envModelEl = null;
            let skyEl = null;

            if (targetType === 'video') {
              const videoId = `arVideo-${index}`;
              videoEl = document.createElement('video');
              videoEl.id = videoId;
              videoEl.src = targetItem.videoUrl || targetItem.mediaUrl;
              videoEl.setAttribute('preload', 'metadata');
              videoEl.setAttribute('crossorigin', 'anonymous');
              videoEl.setAttribute('playsinline', '');
              videoEl.setAttribute('webkit-playsinline', '');
              videoEl.muted = isAudioMuted;
              videoEl.loop = true;
              assetsEl.appendChild(videoEl);
              videoElements.push(videoEl);

              const videoPlane = document.createElement('a-video');
              videoPlane.id = `videoPlane-${index}`;
              videoPlane.setAttribute('src', `#${videoId}`);
              videoPlane.setAttribute('width', '1');
              videoPlane.setAttribute('height', '1');
              videoPlane.setAttribute('position', '0 0 0');
              videoPlane.setAttribute('rotation', '0 0 0');
              targetEntity.appendChild(videoPlane);

              const updateAspect = () => {
                if (videoEl.videoWidth && videoEl.videoHeight) {
                  const ratio = videoEl.videoHeight / videoEl.videoWidth;
                  videoPlane.setAttribute('width', '1');
                  videoPlane.setAttribute('height', ratio.toString());
                }
              };
              videoEl.addEventListener('loadedmetadata', updateAspect);
            } else if (targetType === 'model3d') {
              // OGGETTO 3D SINGOLO (Posizionato sulla carta / piano)
              const modelUrl = targetItem.modelUrl || targetItem.mediaUrl;
              if (modelUrl) {
                modelEl = document.createElement('a-gltf-model');
                modelEl.id = `gltfModel-${index}`;
                modelEl.setAttribute('src', modelUrl);
                
                const pos = targetItem.transform?.position || '0 -0.5 0';
                const rot = targetItem.transform?.rotation || '0 0 0';
                const sca = targetItem.transform?.scale || '0.15 0.15 0.15';

                modelEl.setAttribute('position', pos);
                modelEl.setAttribute('rotation', rot);
                modelEl.setAttribute('scale', sca);
                
                world3DContainer.appendChild(modelEl);
              }
            } else if (targetType === 'environment3d') {
              // RICOSTRUZIONE AMBIENTE 3D (Stanza 1:1 immersiva da modello GLB o fallback)
              const modelUrl = targetItem.modelUrl || targetItem.mediaUrl;
              if (modelUrl) {
                const proceduralBath = document.getElementById('proceduralBath');
                if (proceduralBath) proceduralBath.setAttribute('visible', 'false');

                envModelEl = document.createElement('a-gltf-model');
                envModelEl.id = `gltfEnv-${index}`;
                envModelEl.setAttribute('src', modelUrl);
                
                const pos = targetItem.transform?.position || '0 0 0';
                const rot = targetItem.transform?.rotation || '0 0 0';
                const sca = targetItem.transform?.scale || '1.2 1.2 1.2';

                envModelEl.setAttribute('position', pos);
                envModelEl.setAttribute('rotation', rot);
                envModelEl.setAttribute('scale', sca);
                
                env3DContainer.appendChild(envModelEl);
              }
            } else if (targetType === 'sky360') {
              const skyId = `arSky-${index}`;
              const imgEl = document.createElement('img');
              imgEl.id = skyId;
              imgEl.src = targetItem.skyUrl || targetItem.mediaUrl;
              imgEl.setAttribute('crossorigin', 'anonymous');
              assetsEl.appendChild(imgEl);

              skyEl = document.createElement('a-sky');
              skyEl.id = `skyBox-${index}`;
              skyEl.setAttribute('src', `#${skyId}`);
              skyEl.setAttribute('radius', '20');
              skyEl.setAttribute('opacity', (targetItem.opacity || 0.85).toString());
              skyEl.setAttribute('transparent', 'true');
              skyEl.setAttribute('visible', 'false');
              sceneEl.appendChild(skyEl);
            }

            sceneEl.appendChild(targetEntity);

            // Gestione eventi: Target Riconosciuto
            targetEntity.addEventListener('targetFound', () => {
              if (activeTargetItem && activeTargetItem.videoEl && activeTargetItem.videoEl !== videoEl) {
                activeTargetItem.videoEl.pause();
              }

              activeTargetItem = { index, targetType, videoEl, modelEl, envModelEl, skyEl, targetEntity };

              if (targetType === 'video' && videoEl) {
                // COMPORTAMENTO 1: VIDEO 2D ANCORATO ALLA CARTA
                videoEl.muted = isAudioMuted;
                videoEl.play().catch(e => console.warn('Play prevented:', e));
                arHudBottom.classList.add('hidden');
                recenterBtn.style.display = 'none';
                reset3dBtn.style.display = 'none';
                gestureHint.style.display = 'none';
                world3DContainer.setAttribute('visible', 'false');
                env3DContainer.setAttribute('visible', 'false');
                isTargetTracked = false;
                is3DAnchored = false;
                isGyroActive = false;

                scanReticle.classList.add('detected');
                statusPill.classList.add('active');
              } else if (targetType === 'model3d') {
                // COMPORTAMENTO 2: OGGETTO 3D SINGOLO (Reperto sul tavolo)
                isTargetTracked = true;
                is3DAnchored = true;
                isGyroActive = false;
                env3DContainer.setAttribute('visible', 'false');
                world3DContainer.setAttribute('visible', 'true');

                recenterBtn.textContent = '🎯 Ricentra 3D';
                recenterBtn.style.display = 'inline-flex';
                reset3dBtn.style.display = 'inline-flex';
                gestureHint.innerHTML = '👆 Trascina 1 dito per ruotare • 🤏 Pizzica 2 dita per scalare';
                gestureHint.style.display = 'block';
                arHudBottom.classList.remove('hidden');

                scanReticle.classList.add('detected');
                statusPill.classList.add('active');

                showToast('💡 Oggetto 3D agganciato! Spostati per osservarlo da ogni angolo.');
              } else if (targetType === 'environment3d') {
                // COMPORTAMENTO 3: RICOSTRUZIONE 3D AMBIENTE / STANZA (IMMERSIVO 1:1)
                isTargetTracked = false;
                is3DAnchored = true;
                isGyroActive = true; // Attiva il Giroscopio per guardare la stanza a 360°

                world3DContainer.setAttribute('visible', 'false');
                env3DContainer.setAttribute('visible', 'true');

                // Orientamento iniziale dell'ambiente verso lo sguardo dell'utente
                if (mainCamera && mainCamera.object3D) {
                  env3DContainer.object3D.rotation.y = mainCamera.object3D.rotation.y;
                }

                recenterBtn.textContent = '🧭 Allinea Pareti';
                recenterBtn.style.display = 'inline-flex';
                reset3dBtn.style.display = 'inline-flex';
                gestureHint.innerHTML = '📱 Ruota lo smartphone a 360° • 👆 Trascina per allineare le pareti alla stanza';
                gestureHint.style.display = 'block';
                arHudBottom.classList.remove('hidden');

                scanReticle.classList.add('detected');
                statusPill.classList.add('active');

                showToast('🏛️ Ricostruzione 3D Ambiente attivata! Ruota lo smartphone per esplorare la stanza.');
              } else if (targetType === 'sky360') {
                // COMPORTAMENTO 4: PORTALE 360°
                if (skyEl) skyEl.setAttribute('visible', 'true');
                arHudBottom.classList.remove('hidden');
                scanReticle.classList.add('detected');
                statusPill.classList.add('active');
                isGyroActive = true;
              }
            });

            // Gestione eventi: Target Perso
            targetEntity.addEventListener('targetLost', () => {
              if (activeTargetItem && activeTargetItem.index === index) {
                if (targetType === 'video') {
                  if (videoEl) videoEl.pause();
                  activeTargetItem = null;
                  arHudBottom.classList.add('hidden');
                  scanReticle.classList.remove('detected');
                  statusPill.classList.remove('active');
                } else if (targetType === 'model3d') {
                  // Per Oggetto 3D: Il modello rimane visibile ancorato nello spazio
                  isTargetTracked = false;
                  world3DContainer.setAttribute('visible', 'true');
                  scanReticle.classList.add('detected');
                  statusPill.classList.add('active');
                  showToast('🧊 Oggetto 3D fisso nello spazio.');
                } else if (targetType === 'environment3d') {
                  // Per Ambiente 3D Stanza: SEI DENTRO L'AMBIENTE! La stanza 3D RESTA VISIBILE A 360°
                  env3DContainer.setAttribute('visible', 'true');
                  isGyroActive = true;
                  scanReticle.classList.add('detected');
                  statusPill.classList.add('active');
                  showToast('🏛️ Ricostruzione 3D attiva. Ruota lo smartphone per esplorare l\'ambiente!');
                } else if (targetType === 'sky360') {
                  if (skyEl) skyEl.setAttribute('visible', 'false');
                  activeTargetItem = null;
                  arHudBottom.classList.add('hidden');
                  scanReticle.classList.remove('detected');
                  statusPill.classList.remove('active');
                  isGyroActive = false;
                }
              }
            });
          });
        } catch (err) {
          console.error('[WebAR Setup Error]', err);
        }
      }

      const configPromise = loadDynamicConfig();

      // Avvio fotocamera e sblocco policy al tap sul pulsante centrale
      startBtn.addEventListener('click', async () => {
        await configPromise;

        // Richiesta permessi Sensore Giroscopio / DeviceOrientation per iOS Safari e Android
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            console.log('[DeviceOrientation] Permesso giroscopio:', permissionState);
          } catch (e) {
            console.warn('[DeviceOrientation] Errore richiesta permesso:', e);
          }
        }

        startOverlay.classList.add('hidden');

        // Sblocco e pre-caricamento audio/video per iOS Safari e Android Chrome
        videoElements.forEach(v => {
          v.muted = isAudioMuted;
          v.load();
        });

        try {
          const mindarSystem = sceneEl.systems['mindar-image-system'];
          if (mindarSystem) {
            mindarSystem.start();
          } else {
            sceneEl.addEventListener('loaded', () => {
              sceneEl.systems['mindar-image-system'].start();
            });
          }
        } catch (err) {
          console.error('MindAR error:', err);
        }
      });

      // Toggle Audio (Mute / Unmute)
      audioToggle.addEventListener('click', () => {
        isAudioMuted = !isAudioMuted;
        videoElements.forEach(video => {
          video.muted = isAudioMuted;
        });
        updateAudioUI();
      });

      // Pulsante Ricentra / Allinea Pareti
      recenterBtn.addEventListener('click', () => {
        if (!mainCamera || !mainCamera.object3D) return;
        const cameraObj = mainCamera.object3D;

        if (activeTargetItem && activeTargetItem.targetType === 'environment3d') {
          // In modalità Ambiente 3D: Allinea la rotazione delle pareti all'orientamento attuale della fotocamera
          env3DContainer.object3D.rotation.y = cameraObj.rotation.y;
          showToast('🧭 Pareti della ricostruzione 3D allineate alla tua vista!');
        } else if (world3DContainer) {
          // In modalità Oggetto 3D Singolo: Riposiziona l'oggetto a 1.5m di fronte alla fotocamera
          const dir = new THREE.Vector3(0, 0, -1);
          dir.applyQuaternion(cameraObj.quaternion);

          const camPos = new THREE.Vector3();
          cameraObj.getWorldPosition(camPos);

          const targetPos = camPos.clone().add(dir.multiplyScalar(1.5));
          targetPos.y = camPos.y - 0.3;

          world3DContainer.object3D.position.copy(targetPos);
          world3DContainer.object3D.rotation.set(0, cameraObj.rotation.y, 0);

          showToast('🎯 Oggetto 3D riposizionato di fronte a te!');
        }
      });

      // Pulsante Reset (Nasconde l'ambiente o l'oggetto 3D per scansionare un altro target)
      reset3dBtn.addEventListener('click', () => {
        if (world3DContainer) world3DContainer.setAttribute('visible', 'false');
        if (env3DContainer) env3DContainer.setAttribute('visible', 'false');
        
        is3DAnchored = false;
        isTargetTracked = false;
        isGyroActive = false;
        activeTargetItem = null;

        recenterBtn.style.display = 'none';
        reset3dBtn.style.display = 'none';
        gestureHint.style.display = 'none';
        arHudBottom.classList.add('hidden');
        scanReticle.classList.remove('detected');
        statusPill.classList.remove('active');
        showToast('🔄 Scena 3D resettata. Inquadra un nuovo target!');
      });

      // Slider Opacità ("Ieri vs Oggi") per sfumare l'ambiente 3D con la stanza reale
      opacitySlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        const activeContainer = (activeTargetItem && activeTargetItem.targetType === 'environment3d') ? env3DContainer : world3DContainer;
        if (activeContainer) {
          activeContainer.object3D.traverse((node) => {
            if (node.isMesh && node.material) {
              node.material.transparent = true;
              node.material.opacity = val;
            }
          });
        }
      });

      // Touch Gestures: Ruota (1 dito) e Scalare (2 dita)
      let touchInitialDist = 0;
      let touchInitialScale = 1;
      let isSingleTouch = false;
      let previousTouchX = 0;
      let previousTouchY = 0;

      window.addEventListener('touchstart', (e) => {
        if (!activeTargetItem || !is3DAnchored) return;
        if (e.target.closest('.ar-hud-top') || e.target.closest('.ar-hud-bottom') || e.target.closest('#startOverlay')) return;
        
        const isEnvMode = activeTargetItem.targetType === 'environment3d';
        const targetContainer = isEnvMode ? env3DContainer : world3DContainer;

        if (e.touches.length === 1) {
          isSingleTouch = true;
          previousTouchX = e.touches[0].clientX;
          previousTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2 && !isEnvMode) {
          isSingleTouch = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          touchInitialDist = Math.sqrt(dx * dx + dy * dy);
          if (targetContainer) {
            touchInitialScale = targetContainer.object3D.scale.x;
          }
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (!activeTargetItem || !is3DAnchored) return;
        if (e.target.closest('.ar-hud-top') || e.target.closest('.ar-hud-bottom')) return;

        const isEnvMode = activeTargetItem.targetType === 'environment3d';
        const targetContainer = isEnvMode ? env3DContainer : world3DContainer;
        if (!targetContainer) return;

        if (isSingleTouch && e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - previousTouchX;
          const deltaY = e.touches[0].clientY - previousTouchY;
          
          targetContainer.object3D.rotation.y += deltaX * 0.008;
          if (!isEnvMode) {
            targetContainer.object3D.rotation.x += deltaY * 0.005;
          }

          previousTouchX = e.touches[0].clientX;
          previousTouchY = e.touches[0].clientY;
        } else if (e.touches.length === 2 && touchInitialDist > 0 && !isEnvMode) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDist = Math.sqrt(dx * dx + dy * dy);
          
          const factor = currentDist / touchInitialDist;
          const newScale = Math.max(0.01, Math.min(10, touchInitialScale * factor));
          
          targetContainer.object3D.scale.set(newScale, newScale, newScale);
        }
      });

      window.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) touchInitialDist = 0;
        if (e.touches.length === 0) isSingleTouch = false;
      });
    </script>
  </body>
</html>
